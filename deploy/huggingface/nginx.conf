# Runs as the unprivileged Space user, so every writable path lives in /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    # Photos of the collateral, as in the console's own upload limit.
    client_max_body_size 200m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 7860;

        # The TBC sandbox sends the customer back here after the consent is approved.
        location /oauth/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
        }

        location /api/docs {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://127.0.0.1:8501;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }
    }
}
