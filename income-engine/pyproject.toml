[project]
name = "income-engine"
version = "1.0.0"
description = "Income from consented transactions, NBG PTI/LTV rules and explainable credit risk"
readme = "README.md"
license = "MIT"
requires-python = "==3.12.*"
# The versions the release gates in tests/ were last run with; requirements.txt keeps the ranges
# this engine's own image and CI job install.
dependencies = [
    "fairlearn==0.15.0",
    "fastapi==0.159.1",
    "httpx==0.28.1",
    "joblib==1.6.0",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "plotly==7.1.0",
    "pyarrow==26.0.0",
    "pydantic==2.14.1",
    "PyYAML==6.0.3",
    "scikit-learn==1.9.1",
    "shap==0.54.1",
    "streamlit==1.66.1",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ite"]
