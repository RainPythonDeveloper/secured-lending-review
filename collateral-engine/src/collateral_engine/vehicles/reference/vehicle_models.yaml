# Vehicle models of the synthetic market. Georgia imports most of its cars used, about 58% of them
# from the United States (2023), so the list leans on US-market sedans, crossovers and hybrids.
#
# Every number below is a demo assumption, not market data: there is no official series of used
# car prices in Georgia. new_price_usd is the price of the model new; annual_depreciation the
# share of value lost each year; km_per_year a typical yearly mileage; right_hand_drive_share and
# petrol_gas_share the share of sales with a right-hand drive or a gas conversion.
