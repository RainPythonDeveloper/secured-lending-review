[project]
name = "collateral-engine"
version = "0.1.0"
description = "Second-opinion valuation of residential collateral in Tbilisi and NBG LTV check"
readme = "README.md"
license = "MIT"
requires-python = "==3.12.*"
dependencies = [
    "anthropic==1.12.1",
    "fastapi==0.159.1",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "pillow==13.0.0",
    "pydantic==2.14.1",
    "pydeck==0.9.3",
    "python-multipart==0.0.32",
    "PyYAML==6.0.3",
    "streamlit==1.66.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collateral_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# app/ holds the console modules some tests import, such as the language selector.
pythonpath = ["src", "app"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
# The en dash marks ranges in Georgian and English user-facing text.
allowed-confusables = ["–"]

[tool.ruff.lint.isort]
known-first-party = [
    "collateral_engine",
    "report_view",
    "collateral_form",
    "collateral_view",
    "resources",
    "language",
    "design",
    "overview_page",
    "application_page",
]
known-third-party = ["ite"]
