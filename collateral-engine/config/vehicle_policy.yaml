# Bank policy for vehicles offered as loan collateral.
# NBG Order 84/04 covers real estate only and NBG sets no LTV limit for vehicle loans, so every
# value here is a bank setting, not an NBG rule.
version: "2026-10"

comparables:
  # Sales of the same make and model only.
  max_age_months: 12
  max_production_year_gap: 2
  # A comparable may have at most this many times more or less mileage than the vehicle.
  max_mileage_ratio: 2.0
  min_count: 5
  max_count: 10

hedonic:
  ridge_penalty: 0.001

interval:
  coverage: 0.80
  calibration_months: 3
  max_calibration_sales: 400

lending:
  max_ltv: "0.70"
  # A vehicle older than this when the loan ends is weak collateral for its last instalments.
  max_vehicle_age_at_maturity_years: 12
  # Mileage assumed per year when projecting the value to the end of the loan.
  projected_km_per_year: 15000

fx_stress:
  # Used cars in Georgia are priced in USD; a stronger lari lowers their value in GEL.
  gel_appreciation: "0.20"

photos:
  max_photos: 12
  max_bytes: 15000000
  min_width_px: 640
  min_height_px: 480
  min_mean_brightness: 40
  max_mean_brightness: 225
  min_sharpness: 40.0
  near_duplicate_max_hamming: 6

evidence:
  # Front, rear, both sides, the odometer and the VIN plate.
  min_photos: 6

# Rules that compare what the vision model reads from the photos with the application.
# The model only describes each photo; these rules alone set the status of each claim.
vision:
  # A reading counts only when the model is at least this sure of the photo.
  min_confidence: medium
  # The declared mileage may differ from the odometer by this share before it is contradicted.
  mileage_tolerance: 0.10
  required_views: [front, rear, left_side, right_side, odometer, vin_plate]

flag_severity:
  VEHICLE_INSUFFICIENT_COMPARABLES: physical_inspection
  VEHICLE_NOT_CUSTOMS_CLEARED: physical_inspection
  VEHICLE_ACCIDENT_HISTORY: review
  VEHICLE_RIGHT_HAND_DRIVE: info
  VEHICLE_TOO_OLD_AT_MATURITY: review
  VEHICLE_LTV_ABOVE_BANK_LIMIT: review
  VEHICLE_LTV_ABOVE_BANK_LIMIT_UNDER_FX_STRESS: info
  VEHICLE_TOO_FEW_PHOTOS: review
  VEHICLE_MILEAGE_CONTRADICTED: review
  # The photos may show another vehicle than the one offered.
  VEHICLE_VIN_MISMATCH: physical_inspection
  VEHICLE_UNDECLARED_DAMAGE: review
  VEHICLE_STEERING_MISMATCH: review
  VEHICLE_VIEWS_MISSING: info
  PHOTO_QUALITY_ISSUES: info
  PHOTOS_WITH_PEOPLE_EXCLUDED: info
  NEAR_DUPLICATE_PHOTOS: info
  PHOTO_SEEN_IN_OTHER_APPLICATION: physical_inspection
  VISION_UNAVAILABLE: info
